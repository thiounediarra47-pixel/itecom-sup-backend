# Server
server.port=${PORT:8080}

# MySQL Database
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:elearning_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Dakar
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Avoid unsupported automatic DDL during startup on Railway
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=elearningSecretKey2024VeryLongSecretKeyForHMACSHA256Algorithm
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# Mail (configure avec votre SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:kdiopkhadi57@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:kdiopkhadi57@gmail.com}}
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.enabled=${APP_MAIL_ENABLED:true}

# App Config
app.frontend.url=${FRONTEND_URL:https://itecom-frontend-production.up.railway.app}
app.upload.dir=uploads/
app.max-file-size=50MB
app.admin.email=moussampthioune@gmail.com
app.registration.fee=5000

# Scolarité : numéros marchands affichés aux étudiants pour le paiement mobile
app.school.name=${SCHOOL_NAME:ITECOM}
app.school.city=${SCHOOL_CITY:Dakar}
# Nombre de mensualités dans l'année universitaire (octobre → juin)
app.school.months=${SCHOOL_MONTHS:9}
# Pièces des dossiers d'inscription (bac, relevés) : hors du dossier public uploads/
app.school.documents-dir=${SCHOOL_DOCUMENTS_DIR:school-documents/}
# Enregistrements des classes virtuelles : garder la copie en base tant que uploads/ n'est pas sur un volume persistant
app.recordings.keep-db-copy=${APP_RECORDINGS_KEEP_DB_COPY:true}
app.school.payment.wave-number=${SCHOOL_WAVE_NUMBER:70 000 00 00}
app.school.payment.orange-money-number=${SCHOOL_OM_NUMBER:77 000 00 00}
app.school.payment.free-money-number=${SCHOOL_FREE_MONEY_NUMBER:76 000 00 00}

# Jitsi as a Service (JaaS) - configure via environment variables
# JAAS_PRIVATE_KEY must contain the RSA PKCS#8 PEM key.
app.jaas.domain=${JAAS_DOMAIN:8x8.vc}
app.jaas.app-id=${JAAS_APP_ID:vpaas-magic-cookie-ca9a6a5d06ff44cd886c83c7d70a1626}
app.jaas.key-id=${JAAS_KEY_ID:vpaas-magic-cookie-ca9a6a5d06ff44cd886c83c7d70a1626/bc8c26}
app.jaas.private-key=${JAAS_PRIVATE_KEY:/Users/mac/Desktop/Key 07_09_2026 19_39_13.pk}

# File Upload
# Vidéos de cours et enregistrements de séances (envoyés en fichier, recompressés ensuite)
spring.servlet.multipart.max-file-size=600MB
spring.servlet.multipart.max-request-size=650MB

# JSON body size (pour les vidéos en base64)
spring.mvc.async.request-timeout=300000
server.tomcat.max-http-form-post-size=500MB
server.tomcat.max-swallow-size=-1

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Anthropic AI (optionnel pour démarrer sans clé API)
anthropic.model=claude-opus-4-8
anthropic.api-key=${ANTHROPIC_API_KEY:}

# Exam grading delay (minutes after student submission before AI correction & email report)
app.exam.grading-delay-minutes=2

# Logging
logging.level.com.elearning=DEBUG
logging.level.org.springframework.security=INFO
